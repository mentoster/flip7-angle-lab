name: Android build and tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify public file hygiene
        shell: bash
        run: |
          if git ls-files | grep -Eiq '(^captures/.*\.(csv|tsv|jsonl|parquet)$|(^|/)(\.env([.]|$)|local\.properties$)|\.(jks|keystore|p12|pem|key|pass|apk|aab)$)'; then
            echo "::error::Private captures, credentials or generated APKs are tracked."
            exit 1
          fi
          if git ls-files -z | xargs -0 -r du -b | awk '$1 > 95000000 { bad=1 } END { exit bad }'; then
            echo "Tracked files are below the 95 MB safety threshold."
          else
            echo "::error::A tracked file is too large for the source repository."
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform 37
        run: sdkmanager --install "platforms;android-37.0" "platform-tools"

      - name: Set up Gradle 9.8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.2'

      - name: Build, lint and run unit tests
        run: bash scripts/gradle-local.sh :app:testDebugUnitTest :app:assembleDebug :app:lintDebug
